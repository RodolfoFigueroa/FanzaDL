[project]
name = "fanzadl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.4", "requests>=2.34.2"]


[tool.uv]
package = true

[project.scripts]
fanzadl = "fanzadl.main:main"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "PLR2004", "COM812", "PLR0913"]

[dependency-groups]
dev = ["ipykernel<7"]
